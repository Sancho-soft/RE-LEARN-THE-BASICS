<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240">
  <!-- Soft shadow card -->
  <rect x="26" y="30" width="588" height="188" rx="36" fill="#2F4858" opacity="0.18"/>
  <!-- Main Cream Plaque -->
  <rect x="20" y="20" width="588" height="188" rx="36" fill="#FFF8E7" stroke="#2F4858" stroke-width="8"/>
  <!-- Inner highlight stroke -->
  <rect x="32" y="32" width="564" height="164" rx="26" fill="none" stroke="#FFD166" stroke-width="4" stroke-dasharray="14 10"/>

  <!-- Top Sunny Banner Pill -->
  <rect x="130" y="6" width="368" height="52" rx="26" fill="#FFD166" stroke="#2F4858" stroke-width="7"/>
  <path d="M154 17 H474" stroke="#FFF8E7" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <text x="314" y="42" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-weight="900" font-size="28" fill="#2F4858" letter-spacing="3">RE-LEARN</text>

  <!-- Main Title: THE BASICS -->
  <text x="314" y="132" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-weight="900" font-size="56" fill="#2F4858" letter-spacing="2">THE BASICS</text>

  <!-- Math Charm Badges -->
  <!-- Plus (Leaf Green) -->
  <g transform="translate(80, 148)">
    <circle cx="0" cy="0" r="24" fill="#6BCB77" stroke="#2F4858" stroke-width="6"/>
    <path d="M-9 0 H9 M0 -9 V9" stroke="#FFF8E7" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Minus (Coral) -->
  <g transform="translate(548, 148)">
    <circle cx="0" cy="0" r="24" fill="#FF6B6B" stroke="#2F4858" stroke-width="6"/>
    <path d="M-9 0 H9" stroke="#FFF8E7" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Small bottom subtitle pill -->
  <rect x="204" y="156" width="220" height="36" rx="18" fill="#8ECAE6" stroke="#2F4858" stroke-width="5"/>
  <text x="314" y="180" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-weight="700" font-size="16" fill="#2F4858" letter-spacing="1">COZY MATH PLAY</text>
</svg>
